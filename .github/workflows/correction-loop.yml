name: correction loop
#
# MEMBER VARIANT (B-11752), generated by correction-loop-install.mjs from QOS's correction-loop.yml.
# It keeps the steps that judge this repository's OWN commits. QOS's app-manifest, agents-pointer,
# baseline-ratchet, watching-window and protocol-sweep steps read inputs only QOS has, so they are
# removed rather than left to skip, because a step that skips on absent input reads as a pass.

# B-11209. THE HALF A COMMIT HOOK CANNOT ENFORCE.
#
# The commit-msg hook is fast local feedback and nothing more. `git commit --no-verify` walks past it,
# and `core.hooksPath` is LOCAL config that cannot be committed, so a fresh clone carries the gate's
# files and runs none of them. Measured across the members on 2026-09-23: six carried the diagnosis gate
# at HEAD with `core.hooksPath` UNSET, so its local half had never run in any of them.
#
# The session that rolled this protocol out installed ONLY the hook, then was refused by the sibling
# diagnosis gate three times and cleared every refusal by rewording the commit message. A control that a
# thesaurus satisfies, and that a flag skips, is a request. This job is what makes it a refusal.
#
# BOTH TRIGGERS, because a pull_request-only job covers only the traffic that uses pull requests. The
# push run is HONEST ABOUT WHAT IT IS: a verdict after the commit has landed is a REPORT and cannot
# refuse anything. Where branch protection is used the pull_request run is the gate; where commits go
# straight to main, this is the alarm.
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: correction-loop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: a capability names its caller
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate reads every commit in base..HEAD, so the history must actually be here. A shallow
          # clone would leave it judging nothing and reporting clear, which is the failure it refuses.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: the gate must be present, or this job has verified nothing
        run: |
          # FAIL-CLOSED. A missing gate is not a pass. Without this step a deleted or renamed
          # correction-loop-gate.mjs would make the next step a no-op that exits 0 and reports green.
          test -f scripts/governance/correction-loop-gate.mjs || {
            echo "::error::scripts/governance/correction-loop-gate.mjs is missing — the gate could not run, which is not a pass"
            exit 1
          }

      - name: a capability commit must name what invokes it
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            # A push: the range is what this push actually added. `before` is all-zeroes for a new branch
            # or a force-push, in which case there is no honest range and we say so rather than inventing
            # one that judges nothing and reports clear.
            BASE="${{ github.event.before }}"
            case "$BASE" in
              0000000000000000000000000000000000000000|"")
                echo "::warning::no usable before-sha for this push (new branch or force-push), so no range could be built"
                echo "### Correction loop: COULD NOT RUN" >> "$GITHUB_STEP_SUMMARY"
                echo "No usable commit range for this push. This is not a pass." >> "$GITHUB_STEP_SUMMARY"
                exit 1
                ;;
            esac
          fi
          git rev-parse --verify "$BASE" >/dev/null 2>&1 || {
            echo "::error::$BASE is not resolvable, so the commit range could not be built"
            exit 1
          }
          node scripts/governance/correction-loop-gate.mjs --range "$BASE..HEAD"

      # B-11291. HANDOFF PROTOCOL: the run wrapper, exercised rather than merely present. The close gate
      # covers a session that reaches its own close; nothing covered one that is killed, reaped, OOMed or
      # disconnected, so the next session resumed from an entry describing work two sessions back. This
      # step proves the three properties the wrapper exists for, because a wrapper you have only seen
      # installed is not one you have seen work.
      - name: Handoff Protocol - the abnormal-ending wrapper actually fires (B-11291)
        run: |
          set -euo pipefail
          node --test scripts/state/abnormal-end-handoff.test.mjs
          # The checks below write into a THROWAWAY QOS_REPO rather than the checkout, so nothing has to
          # be deleted afterwards. A check that cleans up after itself with a recursive delete is one bad path
          # expansion away from deleting something real, and the cleanup is avoidable here.
          SANDBOX="$(mktemp -d)"
          git -C "$SANDBOX" init -q 2>/dev/null || true
          # 0. the recorder runs inside an exit trap, so it must ALWAYS exit 0 and must never replace the
          #    exit code it was called to preserve. Invoked by its own path because the wrapper calls it
          #    through a variable, which no reachability model can follow.
          QOS_REPO="$SANDBOX" node scripts/state/abnormal-end-handoff.mjs --code 0
          test ! -d "$SANDBOX/docs/state/abnormal-endings" || { echo "::error::a clean exit wrote an abnormal record"; exit 1; }
          # 1. a non-zero exit is recorded, and 2. the command's exit code survives the wrapper
          set +e; QOS_REPO="$SANDBOX" bash scripts/state/with-handoff.sh bash -c 'exit 7' >/dev/null 2>&1; rc=$?; set -e
          test "$rc" = "7" || { echo "::error::the wrapper changed the exit code: got $rc, want 7"; exit 1; }
          test -d "$SANDBOX/docs/state/abnormal-endings" || { echo "::error::no abnormal record was written"; exit 1; }
          # 3. and what it wrote does NOT read as a handoff
          grep -q 'NOT a handoff' "$SANDBOX"/docs/state/abnormal-endings/*.md
          grep -q 'never written, by anyone' "$SANDBOX"/docs/state/abnormal-endings/*.md
      # B-11752. MEMBER FIXTURES. QOS's version of this step also runs caller-resolves.test.mjs, whose
      # live case is QOS's own commit history; in a member it can only fail. These fixtures hold anywhere.
      - name: Caller Protocol - the resolver still discriminates (B-11752 member fixtures)
        run: |
          set -euo pipefail
          for bad in 'scheduler:hourly("a-job-that-does-not-exist")' 'scripts/does/not/exist.mjs -> also/not/real.mjs'; do
            if node scripts/governance/caller-resolves.mjs --gate --value "$bad" >/dev/null 2>&1; then
              echo "::error::caller-resolves accepted a name that does not exist: $bad"; exit 1
            fi
          done
          node scripts/governance/caller-resolves.mjs --gate --value 'events:on("push")'


      # B-11299 / P3-T4. THE COMMIT'S OWN TRAILER, WHICH IS WHAT THIS CHECK IS FOR.
      #
      # The step above is a SELF-TEST and it was the whole of the reachability check until now: four
      # hardcoded fixtures, two that must fail and two that must pass, and never the trailer under
      # review. `correction-loop-gate` checks the trailer's FORM; nothing checked that the thing it
      # NAMES exists. A commit declaring `scheduler:hourly("a-job-that-does-not-exist")` passed this
      # required check, which is a required check certifying nothing about the commit.
      #
      # THE FIXTURES STAY. They were never the defect; treating them as the whole check was. They catch
      # a resolver that has stopped discriminating at all, which this step cannot: if the resolver said
      # RESOLVED to everything, every real trailer would pass and nobody would know.
      #
      # ORDERING, AND IT IS NOT COSMETIC: this lands only now that the resolver can see hook and
      # harness events. Wiring it first would have refused two honest trailers already on main,
      # events:on("SessionStart") and events:on("commit-msg"), which name invokers that genuinely run.
      # A gate whose first act is refusing correct work is one people switch off.
      - name: the commit's own Caller trailer must name something that exists (B-11299)
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
            case "$BASE" in
              0000000000000000000000000000000000000000|"") echo "::warning::no usable range"; exit 1 ;;
            esac
          fi
          shas=$(git rev-list --no-merges "$BASE..HEAD") || {
            echo "::error::could not read $BASE..HEAD, so no trailer was judged. That is not a pass."; exit 1; }
          checked=0; bad=0; unknown=0
          for c in $shas; do
            v=$(git log -1 --format='%(trailers:only,key=Caller,valueonly)' "$c" | head -1 | sed 's/[[:space:]]*$//')
            [ -z "$v" ] && continue      # whether a trailer is REQUIRED is correction-loop-gate's job
            checked=$((checked+1))
            out=$(node scripts/governance/caller-resolves.mjs --gate --value "$v" 2>&1); rc=$?
            if [ "$rc" -eq 2 ]; then
              unknown=$((unknown+1))
              echo "::error::${c} Caller: $v -- NOT-MEASURED. $out"
            elif [ "$rc" -ne 0 ]; then
              bad=$((bad+1))
              echo "::error::${c} Caller: $v -- names something that does not exist. $out"
            fi
          done
          echo "checked $checked trailer(s): $bad unresolved, $unknown not-measured"
          # A RANGE WITH NO TRAILERS IS A LEGITIMATE ZERO, AND A SILENT GREEN ANYWAY, so it says so.
          # This step's own first CI run checked 0, because the pull request adding it ships no
          # capability and carries no Caller: trailer. It went green having judged nothing, which in a
          # check list is indistinguishable from having judged everything. Not made a failure: a range
          # may honestly hold no trailer, and refusing there would refuse every documentation change.
          # What changes is that the two outcomes are now distinguishable without opening the log.
          if [ "$checked" -eq 0 ]; then
            echo "::notice::no commit in this range carries a Caller: trailer, so this step judged nothing. That is not a statement about caller reachability."
            echo "### Caller reachability: NOTHING TO JUDGE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Caller reachability: $checked trailer(s) judged, $bad unresolved, $unknown not-measured" >> "$GITHUB_STEP_SUMMARY"
          fi
          # NOT-MEASURED FAILS TOO, and deliberately. A resolver that could not read its sources has
          # cleared nothing, and letting exit 2 through is the conflation this repository keeps paying
          # for. It is reported separately so the two are never confused in the log.
          [ "$bad" -eq 0 ] && [ "$unknown" -eq 0 ]
